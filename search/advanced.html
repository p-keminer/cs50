<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="style.css" rel="stylesheet">
        <title>Advanced Search</title>
    </head>
    <body>
     <header class="links d-flex justify-content-end p-3 gap-5 border-bottom border-dark py-4">
        <div>
            <a href="index.html">Google Search</a>
            <a href="pictures.html">Image Search</a>
        </div>
     </header>
        <div class="ms-5 mt-5">
            <h2>Advanced Search</h2>
            <h3>Find pages with</h3>
            <form action="https://google.com/search">
                 <table>
                        <tr>
                            <td><label class="adv-lab">All of these words:</label></td>
                            <td><input class="adv-search" type="text" name="as_q"></td>
                        </tr>
                        <tr>
                            <td><label class="adv-lab">This exakt word or phrase: </label></td>
                            <td><input class="adv-search" type="text" name="as_epq"></td>
                        </tr>
                        <tr>
                            <td><label class="adv-lab">Any of these words</label></td>
                            <td><input class="adv-search" type="text" name="as_oq"></td>
                        </tr>
                        <tr>
                            <td><label class="adv-lab" >None of these words</label></td>
                            <td><input class="adv-search" type="text" name="as_eq"></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><input class="advanced" type="submit" value="Advanced Search"></td>
                        </tr>
                </table>
            </form>
        </div>
    </body>
</html>
